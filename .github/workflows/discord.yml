name: Discord Push Notification

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send push to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_JSON: ${{ toJson(github.event) }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          event = json.loads(os.environ["EVENT_JSON"])
          commit = event.get("head_commit") or {}

          repo = event.get("repository") or {}
          repo_name = repo.get("full_name", "Unknown repository")

          branch = event.get("ref", "").replace("refs/heads/", "")
          actor = (event.get("sender") or {}).get("login", "Unknown")
          sha = event.get("after", "")
          commit_message = commit.get("message", "No commit message")
          commit_url = commit.get("url", "")

          added = commit.get("added") or []
          modified = commit.get("modified") or []
          removed = commit.get("removed") or []

          changes = []

          for file in added:
              changes.append(f"🟢 `{file}`")

          for file in modified:
              changes.append(f"🟡 `{file}`")

          for file in removed:
              changes.append(f"🔴 `{file}`")

          changes_text = "\n".join(changes)

          if not changes_text:
              changes_text = "No file changes listed."

          # Discord embed field has a 1024-character limit.
          if len(changes_text) > 1024:
              changes_text = changes_text[:1000] + "\n…"

          # Only show the first line of the commit message.
          commit_title = commit_message.splitlines()[0] if commit_message else "No commit message"

          payload = {
              "embeds": [
                  {
                      "title": f"🟢 {repo_name.split('/')[-1]}",
                      "description": (
                          f"**{commit_title}**\n\n"
                          f"`{branch}` · "
                          f"`{sha[:7]}` · "
                          f"**{actor}**"
                      ),
                      "color": 0x57F287,
                      "fields": [
                          {
                              "name": "Changes",
                              "value": changes_text
                          }
                      ],
                      "url": commit_url
                  }
              ]
          }

          data = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=data,
              headers={
                  "Content-Type": "application/json"
                  "User-Agent": "Dailies-GitHub-Discord-Webhook/1.0"
              },
              method="POST"
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print(f"Discord response: {response.status}")
                  print(response.read().decode())
          except urllib.error.HTTPError as e:
              print(f"Discord HTTP error: {e.code}")
              print(e.read().decode())
              raise

          PY
